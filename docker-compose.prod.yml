services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: invoice-collector:production
    container_name: invoice-collector-production-app
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      TZ: ${TZ:-Asia/Jakarta}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${PROD_DB_DATABASE:-invoice_collector}
      DB_USERNAME: ${PROD_DB_USERNAME:-invoice_collector}
      DB_PASSWORD: ${PROD_DB_PASSWORD:-invoice_collector}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Production live-code mode: PHP, Blade, routes, migrations, and public
      # files follow the checked-out repository without rebuilding the image.
      - .:/var/www/html
      # Dependencies and Vite output stay isolated from the host checkout.
      - vendor-production-data:/var/www/html/vendor
      - public-build-production-data:/var/www/html/public/build
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  assets:
    image: node:20-alpine
    profiles: ["tools"]
    working_dir: /app
    command: ["sh", "-lc", "npm ci && npm run build"]
    volumes:
      - .:/app
      - node-modules-production-data:/app/node_modules
      - public-build-production-data:/app/public/build

  postgres:
    image: postgres:16-alpine
    container_name: invoice-collector-production-postgres
    environment:
      POSTGRES_DB: ${PROD_DB_DATABASE:-invoice_collector}
      POSTGRES_USER: ${PROD_DB_USERNAME:-invoice_collector}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD:-invoice_collector}
    volumes:
      - postgres-production-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-production-data:
  vendor-production-data:
  public-build-production-data:
  node-modules-production-data:
